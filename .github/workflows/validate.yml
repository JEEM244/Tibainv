name: Validate Tibainv
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required app files and navigation targets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path(".")
          for name in ("index.html", "styles.css", "app.js", "README.md"):
              assert (root / name).is_file(), f"Missing required file: {name}"

          html = (root / "index.html").read_text(encoding="utf-8")
          js = (root / "app.js").read_text(encoding="utf-8")
          assert 'href="styles.css"' in html, "Stylesheet link missing"
          assert 'src="app.js"' in html, "App script link missing"
          for view in ("overview", "character", "inventory", "creatures", "encyclopedia", "notes"):
              assert f'data-view="{view}"' in html, f"Navigation target missing: {view}"
              assert f'{view}:' in js or f'"{view}"' in js, f"Expected view handling not found: {view}"
          print("Static app checks passed.")
          PY
