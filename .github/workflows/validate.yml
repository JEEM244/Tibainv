name: Validate Tibainv
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check core.js
          node --check api.js
          node --check wiki.js
          node --check capture-store.js
          node --check live-monitor.js
          node --check app.js
      - name: Run unit tests
        run: node --test tests/*.test.js
      - name: Check required app files and navigation targets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path(".")
          for name in ("index.html", "styles.css", "core.js", "api.js", "wiki.js", "capture-store.js", "live-monitor.js", "app.js", "README.md", "SECURITY.md", "docs/MANUAL_TESTING.md", "tests/core.test.js"):
              assert (root / name).is_file(), f"Missing required file: {name}"

          html = (root / "index.html").read_text(encoding="utf-8")
          js = (root / "app.js").read_text(encoding="utf-8")
          assert 'href="styles.css"' in html, "Stylesheet link missing"
          assert 'src="core.js"' in html, "Core script link missing"
          assert 'src="api.js"' in html, "API script link missing"
          assert 'src="wiki.js"' in html, "Wiki script link missing"
          assert 'src="capture-store.js"' in html, "Screenshot store script link missing"
          assert 'src="live-monitor.js"' in html, "Live monitor script link missing"
          assert 'src="app.js"' in html, "App script link missing"
          for view in ("overview", "character", "inventory", "creatures", "encyclopedia", "captures", "live-monitor", "notes", "hunts", "kill-counter"):
              assert f'data-view="{view}"' in html, f"Navigation target missing: {view}"
              assert f'{view}:' in js or f'"{view}"' in js, f"Expected view handling not found: {view}"
          assert 'id="import-btn"' in html, "JSON import control missing"
          assert 'id="export-btn"' in html, "JSON export control missing"
          assert 'id="clear-data-btn"' in html, "Local-data reset control missing"
          assert "function renderKillCounter" in js, "Kill counter view missing"
          assert "function renderHunts" in js, "Hunt journal missing"
          assert "function renderCaptures" in js, "Screenshot import view missing"
          live = (root / "live-monitor.js").read_text(encoding="utf-8")
          assert "getDisplayMedia" in live, "Live screen capture is not wired"
          assert "createWorker" in live and "recognize" in live, "Live OCR is not wired"
          assert "TibainvLiveMonitor.render" in js, "Live monitor view is not connected"
          assert "window.TibainvWiki.searchItems" in js, "Public item search is not wired"
          print("Static app checks passed.")
          PY
